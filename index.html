<!DOCTYPE html>
<html>
<head>
  <title>Exercise Logger</title>
  <meta charset="utf-8" />
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; font-size: 2.5em; }
    .step { margin-bottom: 40px; }
    button {
      margin: 10px;
      padding: 25px 45px;
      font-size: 1em;
      cursor: pointer;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 30px;
      font-size: 0.6em;
    }
    th, td {
      border: 1px solid #888;
      padding: 8px;
      text-align: center;
    }
    th { background-color: #eee; }
    .panel {
      border: 2px solid #ccc;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 30px;
      background: #fafafa;
      font-size: 0.6em;
    }
    .latest-item {
      border: 1px solid #ddd;
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 16px;
      background: #fff;
    }
    .latest-item-title {
      font-weight: bold;
      margin-bottom: 10px;
      font-size: 1em;
    }
    .row { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
    .row > * { flex: 0 0 auto; }
    select { font-size: 1em; padding: 10px; }
    .pill {
      display: inline-block;
      padding: 8px 14px;
      margin: 4px;
      border-radius: 999px;
      background: #f0f0f0;
      border: 1px solid #ddd;
      font-size: 0.8em;
    }
    .muted { color: #666; }
    .bold { font-weight: bold; }
    .section-gap { margin-top: 16px; }
    .pinned-badge {
      display: inline-block;
      padding: 8px 14px;
      margin: 4px;
      border-radius: 999px;
      background: #fff3cd;
      border: 1px solid #e0c46c;
      font-size: 0.8em;
      font-weight: bold;
    }

    /* NEW: startup check */
    .startup-panel {
      border: 2px solid #ccc;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 30px;
      background: #fafafa;
      font-size: 0.6em;
    }

    .startup-countdown {
      font-size: 1.3em;
      font-weight: bold;
      margin-top: 10px;
    }
  </style>
</head>

<body>

  <h1>Exercise Logger</h1>

  <!-- NEW: startup check status -->
  <div id="startupCheckContainer"></div>

  <!-- Input step flow -->
  <div id="stepContainer" class="step"></div>

  <!-- Latest input history + quick actions -->
  <div id="latestContainer"></div>

  <!-- Logs table -->
  <div id="logTableContainer"></div>

  <script>
    let log = {};
    let mode = null; // 'swim' | 'heavy' | 'finger' | 'stretch'
    const logs = [];

    const stepContainer = document.getElementById("stepContainer");
    const logTableContainer = document.getElementById("logTableContainer");
    const latestContainer = document.getElementById("latestContainer");

    // NEW
    const startupCheckContainer =
      document.getElementById("startupCheckContainer");


    /* ----------------------------
       Helpers: date & rendering
    -----------------------------*/
    function getToday() {
      const d = new Date();
      return `${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()}`;
    }

    function renderStep(content) {
      stepContainer.innerHTML = "";
      stepContainer.appendChild(content);
    }

    function createButton(text, onClick) {
      const btn = document.createElement("button");
      btn.textContent = text;
      btn.onclick = onClick;
      return btn;
    }

    function generateRange(start, end, step, unit) {
      let arr = [];
      for (let i = start; i <= end; i += step) {
        arr.push(`${i}${unit}`);
      }
      return arr;
    }

    function makeId() {
      return `${Date.now()}_${Math.random().toString(36).slice(2, 9)}`;
    }


    /* ============================================================
       NEW
       Today Exercise Check

       Purpose:
       1. Browser open
       2. Countdown 3 seconds
       3. Check whether exercise has been logged today
       4. If NO -> run SaveToSuccessDaily Shortcut
    ============================================================ */

    const TODAY_ACTIVITY_KEY =
      "exercise_logger_last_logged_day_v1";


    /*
      Mark that an exercise record was created today.

      This only stores the date/time of logging.
      It does NOT duplicate the exercise data.
    */
    function markExerciseLoggedToday() {
      try {
        const payload = {
          date: getToday(),
          ts: Date.now()
        };

        localStorage.setItem(
          TODAY_ACTIVITY_KEY,
          JSON.stringify(payload)
        );
      } catch (e) {
        console.warn(
          "Unable to save today exercise status:",
          e
        );
      }
    }


    /*
      Check whether today already has an exercise log.

      Check order:

      1. Current page logs[]
      2. Persistent TODAY_ACTIVITY_KEY
      3. Existing Latest Input history as fallback
    */
    function hasExerciseLogToday() {
      const today = getToday();


      // 1. Current page session
      const currentSessionHasLog =
        logs.some(entry => entry && entry.date === today);

      if (currentSessionHasLog) {
        return true;
      }


      // 2. Persistent daily status
      try {
        const raw =
          localStorage.getItem(TODAY_ACTIVITY_KEY);

        if (raw) {
          const saved = JSON.parse(raw);

          if (
            saved &&
            saved.date === today
          ) {
            return true;
          }
        }
      } catch (e) {
        console.warn(
          "Unable to read today exercise status:",
          e
        );
      }


      // 3. Fallback:
      // Check existing Latest Input history
      try {
        const history = loadLatestInputsRaw();

        const latestHasToday =
          history.some(item =>
            item &&
            item.entry &&
            item.entry.date === today
          );

        if (latestHasToday) {
          return true;
        }
      } catch (e) {
        console.warn(
          "Unable to check latest history:",
          e
        );
      }


      return false;
    }


    /*
      Run iPhone Shortcut:
      SaveToSuccessDaily
    */
    function runSaveToSuccessDaily() {
      const shortcutName = "SaveToSuccessDaily";
      const text = `${getToday()}, Exercise`;
      const shortcutURL =
        `shortcuts://run-shortcut?name=${encodeURIComponent(shortcutName)}`;

      window.location.href = shortcutURL;
    }


    /*
      Startup 3-second countdown
    */
    function startExerciseStartupCheck() {

      let secondsLeft = 3;

      const panel =
        document.createElement("div");

      panel.className = "startup-panel";


      const title =
        document.createElement("div");

      title.className = "bold";
      title.textContent =
        "Checking today's exercise log...";


      const status =
        document.createElement("div");

      status.className =
        "startup-countdown";

      status.textContent =
        `Checking in ${secondsLeft}...`;


      panel.appendChild(title);
      panel.appendChild(status);

      startupCheckContainer.innerHTML = "";
      startupCheckContainer.appendChild(panel);


      const timer = setInterval(() => {

        secondsLeft--;

        if (secondsLeft > 0) {

          status.textContent =
            `Checking in ${secondsLeft}...`;

          return;
        }


        clearInterval(timer);


        /*
          Actual check after 3 seconds
        */
        const exerciseExists =
          hasExerciseLogToday();


        if (exerciseExists) {

          status.textContent =
            "✓ Exercise log found today.";

          const detail =
            document.createElement("div");

          detail.className = "muted";
          detail.style.marginTop = "10px";

          detail.textContent =
            "SaveToSuccessDaily will not run.";

          panel.appendChild(detail);

        } else {

          status.textContent =
            "No exercise log today.";

          const detail =
            document.createElement("div");

          detail.className = "muted";
          detail.style.marginTop = "10px";

          detail.textContent =
            "Opening SaveToSuccessDaily...";

          panel.appendChild(detail);


          /*
            Run Shortcut automatically
          */
          runSaveToSuccessDaily();
        }

      }, 1000);
    }


    /* ----------------------------
       Latest Input history
       - latest 2
       - normal items expire after 24h
       - pinned items keep forever until unpinned
    -----------------------------*/
    const LATEST_KEY = "exercise_logger_latest_inputs_v3";
    const LATEST_MAX_ITEMS = 2;

    function saveLatestInput(entry) {
      const history = loadLatestInputsRaw();

      history.unshift({
        id: makeId(),
        entry,
        ts: Date.now(),
        pinned: false
      });

      const normalized = normalizeLatestHistory(history);

      localStorage.setItem(
        LATEST_KEY,
        JSON.stringify(normalized)
      );
    }

    function loadLatestInputsRaw() {
      try {
        const raw =
          localStorage.getItem(LATEST_KEY);

        if (!raw) return [];

        const payload =
          JSON.parse(raw);

        if (!Array.isArray(payload)) {
          localStorage.removeItem(LATEST_KEY);
          return [];
        }

        return payload;

      } catch (e) {

        localStorage.removeItem(LATEST_KEY);
        return [];
      }
    }

    function normalizeLatestHistory(history) {

      const now = Date.now();

      const maxAge =
        24 * 60 * 60 * 1000;

      const valid = history

        .filter(item =>
          item &&
          item.entry &&
          typeof item.ts === "number" &&
          typeof item.id === "string"
        )

        .filter(item =>
          item.pinned ||
          (now - item.ts) <= maxAge
        )

        .map(item => ({
          id: item.id,
          entry: item.entry,
          ts: item.ts,
          pinned: !!item.pinned
        }))

        .sort((a, b) => {

          if (a.pinned !== b.pinned)
            return a.pinned ? -1 : 1;

          return b.ts - a.ts;
        })

        .slice(0, LATEST_MAX_ITEMS);

      return valid;
    }


    function loadLatestInputs() {

      const history =
        loadLatestInputsRaw();

      const normalized =
        normalizeLatestHistory(history);

      localStorage.setItem(
        LATEST_KEY,
        JSON.stringify(normalized)
      );

      return normalized;
    }


    function clearLatestIfExpired() {
      loadLatestInputs();
    }


    function setLatestPinned(
      itemId,
      keepAlways
    ) {

      const history =
        loadLatestInputsRaw();

      const updated =
        history.map(item => {

          if (item.id === itemId) {

            return {
              ...item,
              pinned: keepAlways
            };
          }

          return item;
        });


      const normalized =
        normalizeLatestHistory(updated);

      localStorage.setItem(
        LATEST_KEY,
        JSON.stringify(normalized)
      );

      renderLatestInput();
    }


    /* ----------------------------
       Parsing / normalization
    -----------------------------*/

    function parseSets(sets) {

      if (sets == null)
        return null;

      if (typeof sets === "number")
        return sets;

      const m =
        String(sets).match(/(\d+)/);

      return m
        ? parseInt(m[1], 10)
        : null;
    }


    function formatSetsAlwaysPlural(n) {
      return `${n} sets`;
    }


    function formatSetsLikeOriginal(
      oldSets,
      n
    ) {

      if (typeof oldSets === "number")
        return n;

      return formatSetsAlwaysPlural(n);
    }


    function incrementSets(
      sets,
      delta
    ) {

      const n =
        parseSets(sets);

      if (n == null)
        return sets;

      const nn =
        Math.max(1, n + delta);

      return formatSetsLikeOriginal(
        sets,
        nn
      );
    }


    function parseReps(reps) {

      if (!reps)
        return null;

      const m =
        String(reps)
          .match(/(\d+)\s*reps/i);

      if (m)
        return parseInt(m[1], 10);

      return null;
    }


    function changeRepsValue(
      reps,
      delta
    ) {

      const n =
        parseReps(reps);

      if (n == null)
        return reps;

      const nn =
        Math.max(1, n + delta);

      return `${nn} reps`;
    }


    function parseWeightKg(weight) {

      if (!weight)
        return null;

      const s =
        String(weight).trim();

      if (!/kg$/i.test(s))
        return null;

      const num =
        parseFloat(
          s.replace(/kg/i, "")
        );

      return isNaN(num)
        ? null
        : num;
    }


    function adjustWeight(
      weight,
      deltaKg
    ) {

      const w =
        parseWeightKg(weight);

      if (w == null)
        return weight;

      const nw =
        Math.max(
          0,
          w + deltaKg
        );

      const hadDecimal =
        /\d+\.\d+/.test(
          String(weight)
        );

      const display =
        hadDecimal
          ? nw.toFixed(1)
          : String(Math.round(nw));

      return `${display}kg`;
    }


    function addOrReplaceNotePrefix(
      existing,
      prefix,
      value
    ) {

      const notes =
        (existing || "").trim();

      const re =
        new RegExp(
          `(?:^|\\s*\\|\\s*)${prefix}:[^|]*`,
          "i"
        );

      const part =
        `${prefix}:${value}`;

      if (!notes)
        return part;

      if (re.test(notes)) {

        return notes.replace(
          re,
          (m) =>
            m.startsWith(prefix)
              ? part
              : m.replace(
                  /^[\s|]+/,
                  " | "
                ) + part
        );
      }

      return `${notes} | ${part}`;
    }


    function cloneEntry(entry) {
      return JSON.parse(
        JSON.stringify(entry)
      );
    }


    /* --------------------------------------
       Latest Input Panel + Quick Next Steps
    ---------------------------------------*/

    function renderLatestInput() {

      clearLatestIfExpired();

      latestContainer.innerHTML = "";

      const latestItems =
        loadLatestInputs();


      const panel =
        document.createElement("div");

      panel.className = "panel";


      const title =
        document.createElement("div");

      title.innerHTML =
        "<div class='bold' style='font-size:1.2em;margin-bottom:10px;'>Input Record (latest 2; normal = 24h, keep always = until manually stopped)</div>";

      panel.appendChild(title);


      if (latestItems.length === 0) {

        const empty =
          document.createElement("div");

        empty.className = "muted";

        empty.textContent =
          "No recent input in the last 24 hours.";

        panel.appendChild(empty);

        latestContainer.appendChild(panel);

        return;
      }


      latestItems.forEach(
        (item, index) => {

          const latest =
            item.entry;

          const block =
            document.createElement("div");

          block.className =
            "latest-item";


          const itemTitle =
            document.createElement("div");

          itemTitle.className =
            "latest-item-title";

          itemTitle.textContent =
            `Recent #${index + 1}`;

          block.appendChild(
            itemTitle
          );


          if (item.pinned) {

            const badge =
              document.createElement("div");

            badge.className =
              "pinned-badge";

            badge.textContent =
              "Keep Always ON";

            block.appendChild(
              badge
            );
          }


          const sum =
            document.createElement("div");

          sum.style.marginBottom =
            "14px";

          sum.innerHTML = `
            <span class="pill"><span class="muted">Date:</span> ${latest.date || "—"}</span>
            <span class="pill"><span class="muted">Part:</span> ${latest.part || "—"}</span>
            <span class="pill"><span class="muted">Exercise:</span> ${latest.exercise || "—"}</span>
            <span class="pill"><span class="muted">Equip:</span> ${latest.equipment || "—"}</span>
            <span class="pill"><span class="muted">Weight:</span> ${latest.weight || "—"}</span>
            <span class="pill"><span class="muted">Reps:</span> ${latest.reps || "—"}</span>
            <span class="pill"><span class="muted">Sets:</span> ${typeof latest.sets === "number" ? formatSetsAlwaysPlural(latest.sets) : (latest.sets || "—")}</span>
            <span class="pill"><span class="muted">Notes:</span> ${latest.notes || "—"}</span>
          `;

          block.appendChild(sum);


          const quickPickTitle =
            document.createElement("div");

          quickPickTitle.className =
            "bold";

          quickPickTitle.style.marginBottom =
            "8px";

          quickPickTitle.textContent =
            "Quick Select";

          block.appendChild(
            quickPickTitle
          );


          const quickPickRow =
            document.createElement("div");

          quickPickRow.className =
            "row";


          quickPickRow.appendChild(

            createButton(
              "Use this record",
              () => {

                commitNewFromLatest(
                  cloneEntry(latest)
                );
              }
            )
          );


          quickPickRow.appendChild(

            createButton(
              "+1 set",
              () => {

                const base =
                  cloneEntry(latest);

                base.sets =
                  incrementSets(
                    base.sets,
                    1
                  );

                commitNewFromLatest(
                  base
                );
              }
            )
          );


          if (item.pinned) {

            quickPickRow.appendChild(

              createButton(
                "Stop keeping",
                () => {

                  setLatestPinned(
                    item.id,
                    false
                  );
                }
              )
            );

          } else {

            quickPickRow.appendChild(

              createButton(
                "Keep always",
                () => {

                  setLatestPinned(
                    item.id,
                    true
                  );
                }
              )
            );
          }


          block.appendChild(
            quickPickRow
          );


          const header =
            document.createElement("div");

          header.className =
            "bold section-gap";

          header.style.marginBottom =
            "8px";

          header.textContent =
            "Next Step";

          block.appendChild(
            header
          );


          const row =
            document.createElement("div");

          row.className =
            "row";


          const repsWrap =
            document.createElement("div");

          const repsLabel =
            document.createElement("div");

          repsLabel.className =
            "muted";

          repsLabel.textContent =
            "Reduce reps:";


          const repsSelect =
            document.createElement("select");


          [1,2,3,4,5].forEach(n => {

            const opt =
              document.createElement("option");

            opt.value = n;
            opt.textContent = n;

            repsSelect.appendChild(opt);
          });


          const repsBtn =
            createButton(
              "Apply",
              () => {

                const delta =
                  -parseInt(
                    repsSelect.value,
                    10
                  );

                const base =
                  cloneEntry(latest);

                const modified = {
                  ...base,

                  reps:
                    changeRepsValue(
                      base.reps,
                      delta
                    )
                };

                commitNewFromLatest(
                  modified
                );
              }
            );


          repsWrap.appendChild(
            repsLabel
          );

          repsWrap.appendChild(
            repsSelect
          );

          repsWrap.appendChild(
            repsBtn
          );

          row.appendChild(
            repsWrap
          );


          const wtWrap =
            document.createElement("div");

          const wtLabel =
            document.createElement("div");

          wtLabel.className =
            "muted";

          wtLabel.textContent =
            "Adjust weight and reps:";

          wtWrap.appendChild(
            wtLabel
          );


          const weightDeltaLabel =
            document.createElement("div");

          weightDeltaLabel.className =
            "muted";

          weightDeltaLabel.textContent =
            "Weight Δ (-10, -5, 0, +5, +10)";


          const weightDeltaSelect =
            document.createElement("select");


          [-10, -5, 0, 5, 10]
            .forEach(n => {

              const opt =
                document.createElement("option");

              opt.value = n;

              opt.textContent =
                n > 0
                  ? `+${n}`
                  : `${n}`;

              if (n === 0)
                opt.selected = true;

              weightDeltaSelect
                .appendChild(opt);
            });


          wtWrap.appendChild(
            weightDeltaLabel
          );

          wtWrap.appendChild(
            weightDeltaSelect
          );


          const repsDeltaLabel =
            document.createElement("div");

          repsDeltaLabel.className =
            "muted";

          repsDeltaLabel.textContent =
            "Reps Δ (-5..+5, default 0)";


          const repsDeltaSelect =
            document.createElement("select");


          for (
            let n = -5;
            n <= 5;
            n++
          ) {

            const opt =
              document.createElement("option");

            opt.value = n;

            opt.textContent =
              n > 0
                ? `+${n}`
                : `${n}`;

            if (n === 0)
              opt.selected = true;

            repsDeltaSelect
              .appendChild(opt);
          }


          wtWrap.appendChild(
            repsDeltaLabel
          );

          wtWrap.appendChild(
            repsDeltaSelect
          );


          const applyWeightRepsBtn =
            createButton(
              "Apply",
              () => {

                const weightDelta =
                  parseInt(
                    weightDeltaSelect.value,
                    10
                  ) || 0;

                const repsDelta =
                  parseInt(
                    repsDeltaSelect.value,
                    10
                  ) || 0;

                const base =
                  cloneEntry(latest);

                const modified = {

                  ...base,

                  weight:
                    adjustWeight(
                      base.weight,
                      weightDelta
                    ),

                  reps:
                    changeRepsValue(
                      base.reps,
                      repsDelta
                    )
                };

                commitNewFromLatest(
                  modified
                );
              }
            );


          wtWrap.appendChild(
            applyWeightRepsBtn
          );

          row.appendChild(
            wtWrap
          );

          block.appendChild(
            row
          );

          panel.appendChild(
            block
          );
        }
      );


      latestContainer.appendChild(
        panel
      );
    }


    function commitNewFromLatest(
      newEntry
    ) {

      logs.push(newEntry);

      saveLatestInput(
        newEntry
      );

      // NEW:
      // exercise was logged today
      markExerciseLoggedToday();

      renderTable();

      renderLatestInput();
    }


    /* ----------------------------
       Core flow: steps and logging
    -----------------------------*/

    function start() {

      log = {
        date: getToday(),
        weight: "—",
        reps: "—",
        sets: "—",
        notes: ""
      };


      const div =
        document.createElement("div");

      div.innerHTML =
        "<strong>1. What did you do?</strong><br><br>";


      div.appendChild(
        createButton(
          "Swim",
          () => {

            mode = 'swim';

            log.part = "Swim";
            log.exercise = "—";
            log.equipment = "Pool";

            stepSwim();
          }
        )
      );


      div.appendChild(
        createButton(
          "Finger Hang",
          () => {

            mode = 'finger';

            log.part = "Grip";
            log.exercise = "Finger Hang";
            log.equipment = "Hangboard";
            log.sets = 1;

            stepFingerHangWeight();
          }
        )
      );


      div.appendChild(
        createButton(
          "Heavy Lift",
          () => {

            mode = 'heavy';

            stepBodyPart();
          }
        )
      );


      div.appendChild(
        createButton(
          "Stretch",
          () => {

            mode = 'stretch';

            stepStretch();
          }
        )
      );


      renderStep(div);

      renderLatestInput();
    }


    function stepSwim() {

      const div =
        document.createElement("div");

      div.innerHTML =
        "<strong>Times × 30m</strong><br><br>";


      for (
        let i = 1;
        i <= 12;
        i++
      ) {

        div.appendChild(

          createButton(
            i,
            () => {

              log.reps =
                "30m";

              log.sets =
                i;

              finalizeLog();
            }
          )
        );
      }

      renderStep(div);
    }


    /* ----------------------------
       Finger Hang pages
    -----------------------------*/

    function stepFingerHangWeight() {

      const div =
        document.createElement("div");

      div.innerHTML =
        "<strong>Finger Hang — Weight</strong><br><br>";


      div.appendChild(

        createButton(
          "Bodyweight (72kg)",
          () => {

            log.weight =
              "72kg";

            log.notes =
              addOrReplaceNotePrefix(
                log.notes,
                "Load",
                "Bodyweight"
              );

            stepFingerHangDuration();
          }
        )
      );


      [
        "50lb (22kb)",
        "60lb (27kg)",
        "70lb (32kg)"
      ].forEach(w => {

        div.appendChild(

          createButton(
            `${w} (Dumbbell)`,
            () => {

              log.weight = w;

              log.notes =
                addOrReplaceNotePrefix(
                  log.notes,
                  "Load",
                  "Dumbbell"
                );

              stepFingerHangDuration();
            }
          )
        );
      });


      renderStep(div);
    }


    function stepFingerHangDuration() {

      const div =

              alert(

              );

              return;
            }


            const num =
              parseFloat(raw);

            if (
              isNaN(num) ||
              num < 0
            ) {

              alert(
                "Please enter a valid weight."
              );

              return;
            }


            const formatted =
              Number.isInteger(num)
                ? String(num)
                : String(num);


            log.weight =
              `${formatted}${unitSelect.value}`;


            stepReps();

        "keydown",

      row.appendChild(

      );

      );

    /* ----------------------------
       Export formatting
    -----------------------------*/

    function exportLineStandard(e) {

      const date =
        e.date || "";

      const part =
        e.part || "";

      const exercise =
        e.exercise || "";

      const equipment =
        e.equipment || "";

      const weight =
        e.weight || "";


      let repsOut =
        "";

      const repsNum =
        parseReps(e.reps);


      if (
        repsNum != null
      ) {

        repsOut =
          `${repsNum}reps`;

      } else {

        repsOut =
          e.reps || "";
      }


      const nsets =
        parseSets(e.sets);


      const setsOut =
        nsets != null
          ? `${nsets} sets`
          : (e.sets || "");


      const notes =
        (e.notes || "")
          .trim();


      if (notes) {

        return `${date}, ${part}, ${exercise}, ${equipment}, ${weight}, ${repsOut}, ${setsOut}, ${notes}`;
      }


      return `${date}, ${part}, ${exercise}, ${equipment}, ${weight}, ${repsOut}, ${setsOut}`;
    }


    function renderTable() {

      const table =
        document.createElement("table");


      table.innerHTML = `
        <tr>
          <th>Date</th>
          <th>Body Part</th>
          <th>Exercise</th>
          <th>Equipment</th>
          <th>Weight</th>
          <th>Reps</th>
          <th>Sets</th>
          <th>Notes</th>
        </tr>

        ${logs.map(e => `
          <tr>
            <td>${e.date || "—"}</td>
            <td>${e.part || "—"}</td>
            <td>${e.exercise || "—"}</td>
            <td>${e.equipment || "—"}</td>
            <td>${e.weight || "—"}</td>
            <td>${e.reps || "—"}</td>
            <td>${typeof e.sets === "number" ? formatSetsAlwaysPlural(e.sets) : (e.sets || "—")}</td>
            <td>${e.notes || ""}</td>
          </tr>
        `).join("")}
      `;


      logTableContainer.innerHTML =
        "";

      logTableContainer.appendChild(
        table
      );


      const summary =
        logs
          .map(exportLineStandard)
          .join("\n");


      const encoded =
        encodeURIComponent(
          summary
        );


      const shortcutURL =
        `shortcuts://run-shortcut?name=SaveToNotes&input=${encoded}`;


      const saveBtn =
        createButton(
          "Save to iPhone Notes",
          () => {

            window.location.href =
              shortcutURL;
          }
        );


      logTableContainer.appendChild(
        saveBtn
      );
    }


    /* ============================================================
       Boot
    ============================================================ */

    start();

    // NEW:
    // Start 3-second check after webpage opens.
    startExerciseStartupCheck();

  </script>
